name: Unzip Project
on:
  push:
    paths: [ 'icchipuchuu-aab-builder.zip' ]
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o icchipuchuu-aab-builder.zip
          rm icchipuchuu-aab-builder.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract icchipuchuu project"
          git push
          
